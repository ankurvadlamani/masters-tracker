name: Monitor programme pages

on:
  schedule:
    - cron: '30 2 * * *'   # every day at 02:30 UTC (08:00 in India)
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check official pages
        run: python .github/scripts/monitor.py
      - name: Save results
        run: |
          git config user.name "tracker-monitor"
          git config user.email "tracker-monitor@users.noreply.github.com"
          git add monitor.json
          git diff --cached --quiet || git commit -m "Monitor: daily check of programme pages"
          git push
