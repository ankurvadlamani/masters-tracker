<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Masters Journey · Ankur Vadlamani</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/site.css">
<link rel="stylesheet" href="app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%230F1714' stroke='%23C97B3D' stroke-width='4'/%3E%3C/svg%3E">
</head>
<body>

<section id="lock" class="lock dark traces">
  <form id="lockForm" class="lock-box">
    <span class="eyebrow">Masters Journey</span>
    <h1>Private tracker</h1>
    <p>Research, applications, documents, money and visa, from shortlist to arrival. Enter your password to open it.</p>
    <div class="pwrap"><input id="pw" name="password" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go" placeholder="Password" aria-label="Password" required><button type="button" class="pshow" aria-label="Show password" onclick="const i=document.getElementById('pw'),s=i.type==='password';i.type=s?'text':'password';this.textContent=s?'Hide':'Show';i.focus()">Show</button></div>
    <label class="chk"><input id="remember" type="checkbox" checked style="width:auto;letter-spacing:0;padding:0"> Remember on this device</label>
    <button id="lockGo" class="btn btn-copper" type="submit">Unlock</button>
    <div id="lockErr" class="err" role="alert"></div>
  </form>
</section>

<div id="app" hidden>
  <header class="top">
    <div class="in">
      <a class="brand" href="https://ankurvadlamani.github.io/"><i>AV</i> Masters Journey</a>
      <span id="sync" class="sync">Loading…</span>
      <button id="lockBtn" class="btn btn-line" type="button">Lock</button>
    </div>
  </header>
  <div class="shell">
    <nav id="nav" class="side" aria-label="Sections"></nav>
    <main id="view" class="view"></main>
  </div>
</div>

<div id="drawer" class="drawer" aria-hidden="true">
  <div class="scrim"></div>
  <aside class="sheet2" role="dialog" aria-modal="true" aria-labelledby="dTitle">
    <div class="dh">
      <span id="dCat" class="eyebrow"></span>
      <h2 id="dTitle"></h2>
      <div id="dSub"></div>
      <button id="dClose" class="x2" type="button" aria-label="Close">✕</button>
    </div>
    <div id="dBody" class="db"></div>
  </aside>
</div>

<div id="toast" class="toast" role="status"></div>

<script src="app.js"></script>
</body>
</html>
